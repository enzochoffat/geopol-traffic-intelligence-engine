[project]
name = "geopol-traffic-intelligence-engine"
version = "0.1.0"
description = "A traffic intelligence engine for geopolitical analysis."
requires-python = ">=3.11"
dependencies = [
    "requests>=2.32.0",
    "pandas>=2.2",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "folium>=0.15.0",
    "plotly>=5.22",
    "flask>=3.1",
    "flask-cors>=4.2",
    "ollama>=0.3.0",
    ]
[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=4",
    "response>=0.0.4",
    "ruff",
    "mypy",
    "types-PyYAML",
    ]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = 3.11
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]

